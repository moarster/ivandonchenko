server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Asset filenames carry a content hash, so a new build never reuses a URL.
    # `^~` is required: without it the regex location below would match first
    # and downgrade hashed assets to the shorter cache lifetime.
    # A single add_header, not `expires`: the two together emit two competing
    # Cache-Control headers.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # scripts/prerender.mjs writes a per-route index.html with that page's meta
    # tags; those must win over the SPA shell so crawlers get the real head.
    # Anything with no file behind it is a genuine 404, not a soft one.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Still the SPA shell, so React Router renders the styled NotFound page,
    # but served with a 404 status and noindex baked into the HTML.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
